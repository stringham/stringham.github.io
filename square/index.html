<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Cropper</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="./FileSaver.js"></script>
    <script src="./canvas-toBlob.js"></script>
    <script src="./jszip.js"></script>
    <script src="./exif-js.js"></script>
    <script src="./cropresize.js"></script>
</head>
<body>

<header>
    <div class="controls-group">
        <div class="file-upload">
            <label class="btn btn-outline">
                + Add Photos
                <input type="file" id="select" multiple accept="image/*">
            </label>
        </div>
        <span id="photo-count" class="photo-count">0 Photos</span>
        <button id="save" class="btn">Download Zip</button>
    </div>

    <div class="controls-group">
        <div class="input-group">
            <span>Border:</span>
            <input type="number" id="bordersize" value="20">
        </div>
        <label>
            <input id="timestamp" type="checkbox" checked>
            Timestamp
        </label>
        <label title="Compensate for dark prints">
            <input id="brighten" type="checkbox">
            Brighten for Print
        </label>
        <label>
            <input id="four-by-six" type="checkbox" checked>
            4x6 Ratio
        </label>
    </div>
</header>

<div id="cropper-grid">
</div>

</body>
</html>
